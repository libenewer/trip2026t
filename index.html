<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E3A5F">
<title>곡정고 수학여행 인솔교사용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--head:#1E3A5F;--accent:#1F5FA8;--accent-soft:#E3ECF7;--ok:#0E5E50;--ok-soft:#E2EFEA;--ground:#F2F4F7;--ink:#141B24;--muted:#525D6B;--line:#E2E6EC;--warn:#B4470B;--warn-soft:#FBEDE3;--warn-ink:#8A3508;--red:#A61B1B;--red-soft:#FBE7E7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--head);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:2;display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.role{font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;white-space:nowrap}
h1{margin:0;font-size:20px;font-weight:700}
.sync{font-size:12px;opacity:.85}
.demo{background:#FFF4D6;color:#5A4200;font-size:13px;padding:8px 18px;line-height:1.45}
.err{background:var(--warn-soft);color:var(--warn-ink);font-size:13px;padding:8px 18px}
main{flex:1;padding:14px 14px 100px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:16px;font-weight:700}
h3{margin:0;font-size:14px;font-weight:700}
.muted{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--line);padding:4px;border-radius:12px}
.seg button{height:44px;border:0;border-radius:9px;font-weight:600;background:transparent;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,27,36,.14)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chips.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.chip{height:44px;border-radius:10px;font-weight:600;border:1px solid #D5DBE3;background:#fff;color:var(--ink);padding:0 4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.w b{color:var(--warn)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.cc .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cc b{font-size:17px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.line{font-size:13px;line-height:1.45;color:var(--muted)}
.line strong{color:var(--ink);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--line);color:var(--muted)}
.pill.abs{background:var(--warn-soft);color:var(--warn-ink)}
.pill.act{background:var(--accent-soft);color:var(--accent)}
.pill.red{background:var(--red-soft);color:var(--red)}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.info span{color:var(--muted)}.info b{color:var(--ink);font-weight:600}
.ev{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.evr{display:flex;gap:12px;align-items:flex-start}
.time{width:50px;flex-shrink:0;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.time b{font-size:14px}.time span{font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t15{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--muted);line-height:1.4}
.chk{width:88px;min-height:44px;flex-shrink:0;border-radius:10px;border:1.5px solid #C4CCD6;background:#fff;color:var(--ink);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk small{font-size:11px;font-weight:500;opacity:.9}
.abs{margin-left:62px;background:var(--warn-soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.abs h3{font-size:13px;color:var(--warn-ink)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #EBCDB8;border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.nm button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;color:var(--warn-ink);font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input,.row select{flex:1 1 120px;min-width:0;height:42px;border:1px solid #D5DBE3;border-radius:8px;padding:0 10px;background:#fff}
.row select{flex:0 0 auto}
.row button,.btn-s{height:42px;border:0;border-radius:8px;background:var(--warn);color:#fff;font-weight:600;padding:0 14px}
textarea{width:100%;min-height:72px;border:1px solid #D5DBE3;border-radius:8px;padding:10px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.field{height:46px;border:1px solid #D5DBE3;border-radius:10px;padding:0 12px;font-size:16px}
.btn{height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D5DBE3}
details.card{gap:0}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:30px;font-size:16px;font-weight:700}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-size:22px;font-weight:400;color:var(--muted)}
details[open] summary::after{content:'−'}
details[open] summary{margin-bottom:10px}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel:last-child{border-bottom:0}
.tel span{font-size:14px}.tel small{color:var(--muted);font-size:12px;display:block}
.tel b{color:var(--accent);font-size:15px;white-space:nowrap}
.flow{display:flex;flex-direction:column;gap:6px;counter-reset:f;margin:0;padding:0;list-style:none}
.flow li{position:relative;padding:10px 12px 10px 44px;background:var(--ground);border-radius:10px;font-size:14px;line-height:1.5}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:999px;background:var(--head);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flow li small{display:block;color:var(--muted);font-size:12px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
ul.plain li{font-size:14px;line-height:1.5}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pcard.alert{border-color:#F0C9C9;background:#FFFBFB}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ptop b{font-size:15px}
.lock{background:var(--ground);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #D5DBE3;padding-bottom:env(safe-area-inset-bottom);z-index:3}
nav .in{max-width:760px;margin:0 auto;height:66px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chips.c6{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow"><h1>수학여행 인솔교사</h1><span class="role">교사용 · 곡정고 2학년</span></div>
    <span class="sync" id="sync"></span>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<nav aria-label="주 메뉴" id="nav"><div class="in">
  <button type="button" data-tab="board"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>현황</button>

  <button type="button" data-tab="sites"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>체험별</button>

</div></nav>

<script>

const D3_SUNCHEON = D3_HEAD.concat([

]);
const GROUPS = [
  { name: '1조', classes: [3, 4, 6], days: {

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lget = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const tel = (n) => 'tel:' + String(n).replace(/[^0-9]/g, '');
const groupOf = (cls) => GROUPS.find((g) => g.classes.includes(cls));
const items = (cls, day) => groupOf(cls).days[day].map((r, i) => {
  const tilde = r[0].startsWith('~');

  if (day === 1 && i === 1) sub = CLASS_INFO[cls].car + '호차 탑승';
  return { idx: i, time: s, end: tilde ? '까지' : (e ? '~' + e : ''), title: r[1], sub, site: r[3] || null };
});
const dKey = (c, d, i) => `d:${c}:${d}:${i}`;
const aKey = (c, d, i) => `a:${c}:${d}:${i}`;
const hhmm = () => { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); };
const autoDay = () => { const n = new Date(); return (n.getFullYear() === 2026 && n.getMonth() === 9 && n.getDate() >= 21 && n.getDate() <= 23) ? n.getDate() - 20 : 1; };

async function load(silent) {
  if (!API_URL) { try { store = JSON.parse(lget('t-demo') || '{}'); } catch (e) { store = {}; } S.lastSync = new Date(); if (!silent) render(); return; }
  if (needLogin()) return;
  try {
    const res = await fetch(API_URL + '?code=' + encodeURIComponent(S.code));
    const j = await res.json();
    if (!j.ok) { S.error = '비밀번호가 맞지 않아요. 다시 입력해 주세요.'; S.code = ''; lset('t-code', null); }
    else { store = j.data; ref = j.ref || {}; S.error = ''; S.lastSync = new Date(); }
  } catch (e) { S.error = '서버에 연결하지 못했어요. 인터넷 연결을 확인하고, 계속 이러면 Apps Script 웹 앱의 액세스 권한이 「모든 사용자」인지 확인해 주세요.'; }
  if (!S.error && !(ref['요보호'] || []).length && !(ref['교사연락처'] || []).length) S.error = '구글 시트에서 학생·교사 명단을 받지 못했어요. Apps Script에서 setupSheets를 실행했는지, 새 버전으로 다시 배포했는지 확인해 주세요.';
  const a = document.activeElement;
  const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
  if (!silent || !typing) render();
}

async function write(ops, log) {
  ops.forEach((o) => { if (o.value === null) delete store[o.key]; else store[o.key] = o.value; });
  render();
  if (!API_URL) { lset('t-demo', JSON.stringify(store)); return; }
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ code: S.code, by: S.by, ops, log }) });
    const j = await res.json();
    if (j.ok) { store = j.data; S.error = ''; S.lastSync = new Date(); }
    else S.error = '저장하지 못했어요. 비밀번호를 확인해 주세요.';
  } catch (e) { S.error = '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; }
  render();
}

/* ===== 계산 ===== */
function classStatus(cls, day) {
  const list = items(cls, day);
  let lastIdx = -1, done = 0;
  list.forEach((it) => { if (store[dKey(cls, day, it.idx)]) { lastIdx = it.idx; done++; } });
  const last = lastIdx >= 0 ? list[lastIdx] : null;
  const next = list.find((it) => it.idx > lastIdx && !store[dKey(cls, day, it.idx)]);
  const absent = list.reduce((n, it) => n + ((store[aKey(cls, day, it.idx)] || []).length), 0);
  return { total: list.length, done, last, lastInfo: last ? store[dKey(cls, day, last.idx)] : null, next, absent };
}
function siteRows(key) {
  const rows = [];
  for (let c = 1; c <= 10; c++) {
    const g = groupOf(c);
    [1, 2, 3].forEach((d) => g.days[d].forEach((r, i) => {
      if (r[3] === key) rows.push({ cls: c, group: g.name, day: d, idx: i, time: r[0].split('-')[0], done: store[dKey(c, d, i)], absent: store[aKey(c, d, i)] || [] });
    }));
  }
  return rows.sort((a, b) => (a.day - b.day) || a.time.localeCompare(b.time) || (a.cls - b.cls));
}
const incidents = () => Object.keys(store).filter((k) => k.startsWith('i:')).map((k) => ({ key: k, ...store[k] })).sort((a, b) => b.key.localeCompare(a.key));
const refRows = (name) => (ref[name] || []);
const hasRef = () => Object.keys(ref).length > 0;

      <button type="button" class="chk${d ? ' on' : ''}" data-toggle="${dk}" data-label="${esc(cls + '반 ' + it.title)}" aria-pressed="${!!d}">${d ? `완료 ${esc(d.t)}<small>${esc(d.by)}</small>` : '완료 체크'}</button>
    </div>`;
    if (it.site) {
      h += `<div class="abs"><h3>체험 인원 ${ci.n - abs.length}/${ci.n}명 · 미참가 ${abs.length}명</h3>`;
      if (abs.length) h += '<div class="names">' + abs.map((a, i) => `<span class="nm">${esc(a.name)} · ${esc(a.reason)}<button type="button" data-delabs="${ak}" data-i="${i}" data-label="${esc(cls + '반 ' + it.title + ' 미참가 삭제: ' + a.name)}" aria-label="${esc(a.name)} 삭제">×</button></span>`).join('') + '</div>';
      h += `<form class="row" data-abskey="${ak}" data-label="${esc(cls + '반 ' + it.title)}">

      <div class="row"><button type="button" class="btn-s" style="background:${x.status === '완료' ? '#525D6B' : '#0E5E50'}" data-incstat="${x.key}">${x.status === '완료' ? '처리 중으로 되돌리기' : '처리 완료로 표시'}</button>
      <button type="button" class="btn-s" style="background:#fff;color:#A61B1B;border:1px solid #F0C9C9" data-incdel="${x.key}">삭제</button></div></div>`).join('') + '</div>';

  else h += '<p class="muted" style="margin-bottom:8px">식사 전 식단표와 대조하고, 인솔교사가 먼저 시식해요.</p><div class="scroll"><table><thead><tr><th>학생</th><th>음식</th><th>증상</th><th>보호자</th></tr></thead><tbody>' +

  h += '</details>';
  return h;

  // 내 정보
  h += `<section class="card"><h2>내 정보</h2>
    <p class="muted">이름: <strong style="color:var(--ink)">${esc(S.by)}</strong> · ${API_URL ? '구글 시트와 공유 중' : '데모 모드 (이 기기에만 저장)'}</p>
    <p class="muted">마지막 동기화: ${S.lastSync ? S.lastSync.toLocaleTimeString('ko-KR') : '—'} · ${REFRESH_SEC}초마다 자동 새로고침</p>
    <div class="row"><button type="button" class="btn" style="flex:1" data-act="refresh">지금 새로고침</button><button type="button" class="btn ghost" style="flex:1" data-act="logout">로그아웃</button></div>
    <p class="muted">공용 기기에서는 사용 후 꼭 로그아웃해 주세요.</p></section>`;
  return h;
}

function render() {
  const login = needLogin();
  document.getElementById('nav').style.display = login ? 'none' : '';
  document.getElementById('sync').textContent = login ? '' : `${S.by} · ${S.lastSync ? '동기화 ' + S.lastSync.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '불러오는 중…'}`;
  document.getElementById('banner').innerHTML =
    (!API_URL ? '<div class="demo">데모 모드: 체크 내용이 이 기기에만 저장되고, 학생 건강정보·교사 연락처는 표시되지 않아요. 구글 시트를 연결하려면 API_URL을 설정하세요.</div>' : '') +
    (S.error ? `<div class="err">${esc(S.error)}</div>` : '');
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  const m = document.getElementById('main');
  if (login) { m.innerHTML = viewLogin(); return; }
  const open = [...m.querySelectorAll('details')].map((d) => d.open);
  const views = { board: viewBoard, check: viewCheck, sites: viewSites, students: viewStudents, info: viewInfo };
  const prevTab = m.dataset.tab;
  m.innerHTML = views[S.tab]();
  if (prevTab === S.tab) m.querySelectorAll('details').forEach((d, i) => { if (i < open.length) d.open = open[i]; });
  m.dataset.tab = S.tab;
}

/* ===== 이벤트 ===== */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { S.tab = ds.tab; window.scrollTo(0, 0); render(); }
  else if (ds.day) { S.day = +ds.day; render(); }
  else if (ds.cls) { S.cls = +ds.cls; lset('t-cls', ds.cls); render(); }
  else if (ds.sf !== undefined) { S.sfilter = +ds.sf; render(); }
  else if (ds.gocls) { S.cls = +ds.gocls; lset('t-cls', ds.gocls); S.tab = 'check'; window.scrollTo(0, 0); render(); }
  else if (ds.toggle) {
    if (store[ds.toggle]) { if (confirm('완료 표시를 취소할까요?')) write([{ key: ds.toggle, value: null }], ds.label + ' 완료 취소'); }
    else write([{ key: ds.toggle, value: { t: hhmm(), by: S.by } }], ds.label + ' 완료');
  }
  else if (ds.delabs) {
    const list = (store[ds.delabs] || []).slice();
    list.splice(+ds.i, 1);
    write([{ key: ds.delabs, value: list.length ? list : null }], ds.label);
  }
  else if (ds.incstat) {
    const x = { ...store[ds.incstat] };
    x.status = x.status === '완료' ? '처리 중' : '완료';
    write([{ key: ds.incstat, value: x }], `사안 ${x.status}: ${x.cls}반 ${x.who}`);
  }
  else if (ds.incdel) {
    const x = store[ds.incdel];
    if (x && confirm('이 사안 기록을 삭제할까요?')) write([{ key: ds.incdel, value: null }], `사안 기록 삭제: ${x.cls}반 ${x.who}`);
  }
  else if (ds.act === 'refresh') load();
  else if (ds.act === 'logout') { S.code = ''; S.by = ''; ref = {}; lset('t-code', null); lset('t-name', null); render(); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (!t.matches || !t.matches('[data-roomq]')) return;
  const q = t.value.trim().toLowerCase();
  const box = t.closest('details');
  box.querySelectorAll('tr[data-room]').forEach((tr) => { tr.style.display = !q || tr.dataset.room.includes(q) ? '' : 'none'; });
  box.querySelectorAll('h3[data-floor]').forEach((hd) => {
    const any = [...box.querySelectorAll('tr[data-room]')].some((tr) => tr.dataset.fl === hd.dataset.floor && tr.style.display !== 'none');
    hd.style.display = any ? '' : 'none';
    hd.nextElementSibling.style.display = any ? '' : 'none';
  });
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'login') {
    S.by = f.elements.name.value.trim(); lset('t-name', S.by);
    if (f.elements.code) { S.code = f.elements.code.value.trim(); lset('t-code', S.code); }
    S.error = ''; render(); load();
    return;
  }
  if (f.id === 'incident') {
    const e = f.elements;
    const rec = { cls: e.cls.value, who: e.who.value.trim(), place: e.place.value.trim(), what: e.what.value.trim(), act: e.act.value.trim(), t: hhmm(), day: DAY_INFO[autoDay()].slice(0, 3), by: S.by, status: '처리 중' };
    if (!rec.who || !rec.what) return;
    write([{ key: 'i:' + Date.now(), value: rec }], `사안 기록: ${rec.cls}반 ${rec.who} - ${rec.what.slice(0, 40)}`);
    return;
  }
  if (f.dataset.abskey) {
    const name = f.elements.name.value.trim();
    if (!name) return;
    const reason = f.elements.reason.value;
    const list = (store[f.dataset.abskey] || []).concat([{ name, reason }]);
    write([{ key: f.dataset.abskey, value: list }], f.dataset.label + ' 미참가 추가: ' + name + ' (' + reason + ')');
  }
});

render();
load();
if (API_URL) setInterval(() => load(true), REFRESH_SEC * 1000);
</script>
</body>
</html>
